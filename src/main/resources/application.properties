spring.application.name=secureops

# ── Database ────────────────────────────────────────────────────────────────
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# as environment variables. Never commit real credentials here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/secureops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── Hibernate / JPA ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── HikariCP ────────────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ── DevTools ────────────────────────────────────────────────────────────────
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Mail ────────────────────────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Frontend origin (CORS) ──────────────────────────────────────────────────
FRONTEND_URL=http://localhost:5173

# ── Milestone 1: Infrastructure Monitoring ─────────────────────────────────
monitoring.thresholds.cpu-warning=70
monitoring.thresholds.cpu-critical=90
monitoring.thresholds.memory-warning=75
monitoring.thresholds.memory-critical=90
monitoring.thresholds.disk-warning=80
monitoring.thresholds.disk-critical=95
monitoring.thresholds.heartbeat-offline-minutes=5

# ── Telemetry simulation ────────────────────────────────────────────────────
# Demo/simulated data. Disable when real metrics collection is connected.
monitoring.simulation.enabled=true
monitoring.simulation.interval-ms=15000

# ── Bootstrap administrator ─────────────────────────────────────────────────
# Password is intentionally not stored in source control.
secureops.bootstrap.admin.username=${SECUREOPS_BOOTSTRAP_ADMIN_USERNAME:admin}
secureops.bootstrap.admin.password=${SECUREOPS_BOOTSTRAP_ADMIN_PASSWORD:}
secureops.bootstrap.admin.email=${SECUREOPS_BOOTSTRAP_ADMIN_EMAIL:admin@sentinelcore.local}