spring.application.name=dashboard

# ── Database ────────────────────────────────────────────────────────────────
# PostgreSQL is used when these environment variables are supplied. Otherwise, use a local
# file-backed H2 database so the application can run without external infrastructure.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sentinelcore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── Hibernate / JPA ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# ── HikariCP — tuned for Neon serverless PostgreSQL ────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ── DevTools (disabled in production) ────────────────────────────────────────
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Mail ──────────────────────────────────────────────────────────────────────
# Fallback to empty string — SmtpValidator will warn but not crash if unset.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
